# Render Infrastructure as Code Blueprint - 100% Free Forever Setup
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ---------------------------------------------------------------------------
  # UNIFIED FULL-STACK WEB SERVICE (100% Free Web Service - No Credit Card Needed)
  # ---------------------------------------------------------------------------
  - type: web
    name: nexus-exchange
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:server
    preDeployCommand: npm run db:deploy
    startCommand: npm run start:server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT_MODE
        value: PAPER_TRADING
      - key: CORS_ORIGIN
        value: '*'
      # Render Free Tier Keep-Alive Configuration
      - key: KEEP_ALIVE_ENABLED
        value: 'true'
      - key: KEEP_ALIVE_INTERVAL_MINUTES
        value: '10'
      # Auto-generated high-entropy cryptographic secrets
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Optional: Neon.tech / Supabase free permanent PostgreSQL URL (leave empty for built-in high-performance mode)
      - key: DATABASE_URL
        sync: false
      # Optional external broker & exchange integrations
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_API_SECRET
        sync: false
      - key: ALPACA_API_URL
        value: https://paper-api.alpaca.markets
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: COINBASE_COMMERCE_API_KEY
        sync: false
